services:
  backend:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${ASUNA_BIND_HOST:-127.0.0.1}:${ASUNA_PORT:-8000}:8000"
    environment:
      ASUNA_DEVICE: ${ASUNA_DEVICE:-cpu}
      ASUNA_CORS_ORIGINS: ${ASUNA_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ASUNA_PUBLIC_BASE_URL: ${ASUNA_PUBLIC_BASE_URL:-}
    volumes:
      - type: bind
        source: ${ASUNA_IMAGES_DIR:-../data/raw_images}
        target: /data/raw_images
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ASUNA_EMBEDDINGS_DIR:-../data/embeddings}
        target: /data/embeddings
        read_only: true
        bind:
          create_host_path: false
      - model-cache:/home/asuna/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  model-cache:
